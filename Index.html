<html lang="vi">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        .gaming-font {

            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.4);
        }
    </style>
</head>
<body class="bg-[#0b0f19] min-h-screen text-gray-100 flex flex-col justify-between">

    <!-- HEADER & NAVBAR -->
    <header class="bg-[#111827]/90 backdrop-blur-md sticky top-0 z-50 border-b border-red-900/30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <!-- Logo -->
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('home')">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-red-600 to-amber-500 flex items-center justify-center gaming-glow">
                    <i class="fa-solid fa-gamepad text-2xl text-white"></i>
                </div>
                <div>
                    <h1 class="gaming-font text-xl sm:text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-amber-400">
                        SHOP GAME PRO
                    </h1>
                    <p class="text-xs text-gray-400 font-semibold tracking-widest uppercase">Uy Tín - Nhanh Chóng - 24/7</p>
                </div>
            </div>

            <!-- Desktop Nav -->
            <nav class="hidden md:flex items-center space-x-6 text-sm font-medium">
                <button onclick="switchTab('home')" class="nav-btn text-red-400 hover:text-red-300 transition py-2 border-b-2 border-red-500" data-target="home">Trang Chủ</button>
                <button onclick="switchTab('accounts')" class="nav-btn text-gray-300 hover:text-red-400 transition py-2 border-b-2 border-transparent" data-target="accounts">Kho Acc Game</button>
                <button onclick="switchTab('topup')" class="nav-btn text-gray-300 hover:text-red-400 transition py-2 border-b-2 border-transparent" data-target="topup">Nạp Thẻ / Nạp Game</button>
                <button onclick="switchTab('history')" class="nav-btn text-gray-300 hover:text-red-400 transition py-2 border-b-2 border-transparent" data-target="history">Lịch Sử GD</button>
            </nav>

            <!-- User Auth & Admin Button -->
            <div class="flex items-center space-x-3">
                <div id="admin-menu-container"></div>
                <div id="auth-container">
                    <button onclick="openLoginModal()" class="bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white font-semibold px-4 py-2 rounded-xl shadow-lg transition flex items-center space-x-2 text-sm">
                        <i class="fa-solid fa-user-shield"></i>
                        <span class="hidden sm:inline">Đăng Nhập Gmail</span>
                    </button>
                </div>
            </div>
        </div>
    </header>
